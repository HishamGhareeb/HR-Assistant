[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ral-hr-assistant"
version = "0.1.0"
description = "Secure, human-in-the-loop HR assistant"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langfuse>=2.60,<3",
    "llm-guard>=0.3,<1",
    "openfga-sdk>=0.8,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2,<3",
    "pyjwt[crypto]>=2.9,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.hatch.build.targets.wheel]
packages = ["glue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
