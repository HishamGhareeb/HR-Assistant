# Local development only.  No service is granted access to real HR systems
# by default; use synthetic data and an untracked .env file for local keys.
name: hr-assistant

services:
  openfga:
    image: openfga/openfga:v1.8.12
    command: run
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:3000:3000"
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "true"
    healthcheck:
      # Probe the running gRPC API (and therefore its datastore), not merely
      # whether the image's binary can print a version string.
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
    profiles: ["api"]
    env_file:
      - path: .env
        required: false
    environment:
      OPENFGA_API_URL: http://openfga:8080
    depends_on:
      openfga:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
